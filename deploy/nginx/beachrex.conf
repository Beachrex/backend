# ---------- DEV MCP Server (mcp-dev.beachrex.com) ----------
# MCP server for AI agents (Claude, ChatGPT) — proxy to PM2 process on port 3100
upstream beachrex_mcp_dev { server 127.0.0.1:3100; }

server {
    listen 80;
    server_name mcp-dev.beachrex.com;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    http2 on;
    access_log /var/log/nginx/access.log beachrex_timed;
    server_name mcp-dev.beachrex.com;
    ssl_certificate /etc/letsencrypt/live/mcp-dev.beachrex.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mcp-dev.beachrex.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # MCP endpoint — Streamable HTTP transport
    location /mcp {
        proxy_pass http://beachrex_mcp_dev;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # Health check
    location /health {
        proxy_pass http://beachrex_mcp_dev;
        proxy_set_header Host $host;
    }
}