# BeachRex VPS — Host-level Nginx reverse proxy configuration.
# Place in /etc/nginx/sites-available/beachrex and symlink to sites-enabled.
# SSL certificates are managed by Certbot (Let's Encrypt).
# The upstream blocks below point to the container ports published on 127.0.0.1.

# ---------- Upstreams ----------
upstream beachrex_api_prod  { server 127.0.0.1:8081; }
upstream beachrex_api_uat   { server 127.0.0.1:8082; }
upstream beachrex_api_dev   { server 127.0.0.1:8083; }
upstream beachrex_front_prod  { server 127.0.0.1:3001; }
upstream beachrex_front_uat   { server 127.0.0.1:3002; }
upstream beachrex_front_dev   { server 127.0.0.1:3003; }

# ---------- UAT API (HTTP -> HTTPS redirect) ----------
server {
    listen 80;
    server_name uat-api.beachrex.com;
    return 301 https://$host$request_uri;
}

# ---------- UAT API (HTTPS) ----------
server {
    listen 443 ssl;
    server_name uat-api.beachrex.com;
    client_max_body_size 25M;
    ssl_certificate /etc/letsencrypt/live/uat-api.beachrex.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/uat-api.beachrex.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    location / {
        proxy_pass http://beachrex_api_uat;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ---------- UAT Frontend (HTTP -> HTTPS redirect) ----------
server {
    listen 80;
    server_name uat.beachrex.com;
    return 301 https://$host$request_uri;
}

# ---------- UAT Frontend (HTTPS) ----------
server {
    listen 443 ssl;
    server_name uat.beachrex.com;
    ssl_certificate /etc/letsencrypt/live/uat-api.beachrex.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/uat-api.beachrex.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    location / {
        proxy_pass http://beachrex_front_uat;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

