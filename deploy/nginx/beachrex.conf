# BeachRex VPS — Host-level Nginx reverse proxy configuration.
# Place in /etc/nginx/sites-available/beachrex and symlink to sites-enabled.
# SSL certificates are managed by Certbot (Let's Encrypt).
# The upstream blocks below point to the container ports published on 127.0.0.1.

# ---------- Upstreams ----------
upstream beachrex_api_prod  { server 127.0.0.1:8081; keepalive 32; }
upstream beachrex_api_uat   { server 127.0.0.1:8082; keepalive 32; }
upstream beachrex_api_dev   { server 127.0.0.1:8083; keepalive 32; }

# ---------- Websites: blue/green (zero-downtime deploys, ADR 2026-10-29) ----------
# Each environment has two Next.js containers: blue front_<env> (3001/3002/3003, the normal one) and green
# front_<env>_green (3011/3012/3013, runs only during a deploy). Two upstreams per environment, each with the
# other color as `backup` (used only when the primary refuses connections, so a wrong choice still serves):
#   beachrex_front_<env>        blue first  — the default
#   beachrex_front_<env>_green  green first — chosen while /opt/beachrex/nginx-state/front_<env>.conf says so
# The deploy (deploy/scripts/front-deploy.sh) writes that file and reloads nginx (graceful). The file lives
# outside deploy/ because every deploy syncs deploy/ with --delete. No file = blue, so this config also works
# with the old one-container deploy. Runbook: docs/runbooks/zero-downtime-deploys.md
upstream beachrex_front_prod        { server 127.0.0.1:3001 max_fails=1 fail_timeout=5s; server 127.0.0.1:3011 backup; keepalive 16; }
upstream beachrex_front_prod_green  { server 127.0.0.1:3011 max_fails=1 fail_timeout=5s; server 127.0.0.1:3001 backup; keepalive 16; }
upstream beachrex_front_uat         { server 127.0.0.1:3002 max_fails=1 fail_timeout=5s; server 127.0.0.1:3012 backup; keepalive 16; }
upstream beachrex_front_uat_green   { server 127.0.0.1:3012 max_fails=1 fail_timeout=5s; server 127.0.0.1:3002 backup; keepalive 16; }
upstream beachrex_front_dev         { server 127.0.0.1:3003 max_fails=1 fail_timeout=5s; server 127.0.0.1:3013 backup; keepalive 16; }
upstream beachrex_front_dev_green   { server 127.0.0.1:3013 max_fails=1 fail_timeout=5s; server 127.0.0.1:3003 backup; keepalive 16; }

# Keep upstream connections alive (keepalive above) except for WebSocket upgrades.
map $http_upgrade $beachrex_front_connection {
    default upgrade;
    ''      '';
}

# ---------- Real visitor IP behind Cloudflare (2026-10-09) ----------
# All sites are proxied by Cloudflare (orange cloud), so the TCP peer is a Cloudflare edge server shared by
# many visitors. For connections from Cloudflare's ranges only, $remote_addr becomes CF-Connecting-IP (the
# visitor). Anyone connecting directly to the VPS cannot set it. The rate limit below, the X-Forwarded-For
# sent to Laravel (throttles, view counts) and the access log all use this real IP.
# Source: https://www.cloudflare.com/ips-v4 and /ips-v6 (fetched 2026-10-09; the list changes very rarely).
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

# ---------- Public API rate limit (scalability audit 2026-10-09) ----------
# Per real client IP ($binary_remote_addr after the Cloudflare real-IP step above; X-Forwarded-For can be forged).
# The VPS itself and private networks are not limited: the Next.js servers call the APIs from Docker networks
# (or via the public IP) for every page render. An empty key disables limiting for a request.
geo $beachrex_api_unlimited {
    default        0;
    127.0.0.0/8    1;
    10.0.0.0/8     1;
    172.16.0.0/12  1;
    192.168.0.0/16 1;
    2.28.76.142    1;
}
map $beachrex_api_unlimited $beachrex_api_limit_key {
    0 $binary_remote_addr;
    1 "";
}
limit_req_zone $beachrex_api_limit_key zone=beachrex_api:20m rate=20r/s;

# ---------- Per-network limits and website pages (ADR 2026-10-30 "API performance", incident 2026-10-30) ----------
# The scraper of 2026-10-30 used ~130 addresses of one /24 at ~0.5 r/s each: every single IP stayed far below the
# per-IP limit. A second zone counts the whole /24 (IPv4) or /64 (IPv6, uncompressed prefix) together. Mobile
# carriers put many people behind one /24, so these limits are generous; Cloudflare rules are the first line
# (runbook docs/runbooks/performance-and-bots.md).
map $remote_addr $beachrex_client_net {
    "~^(?<net4>\d+\.\d+\.\d+)\.\d+$"                       $net4;
    "~^(?<net6>[0-9a-fA-F]+:[0-9a-fA-F]+:[0-9a-fA-F]+:[0-9a-fA-F]+):" $net6;
    default                                                     $remote_addr;
}
map $beachrex_api_unlimited $beachrex_net_limit_key {
    0 $beachrex_client_net;
    1 "";
}
limit_req_zone $beachrex_net_limit_key zone=beachrex_api_net:20m rate=60r/s;
# Website pages (Next.js renders them; ISR-cached pages are cheap, uncached ones are not). Static files
# (/_next/static, /_next/image, images) are not limited. A page view with link prefetching sends a burst of
# requests, hence the large burst. Our own servers (geo above) are never limited.
limit_req_zone $beachrex_api_limit_key zone=beachrex_pages:20m rate=8r/s;
limit_req_zone $beachrex_net_limit_key zone=beachrex_pages_net:20m rate=25r/s;

# Access log with timings and the real visitor IP (after the real-IP step above). Fields: visitor IP, host,
# request, status, bytes, request time, upstream time, upstream status, referer, user agent, Cloudflare ray/country.
log_format beachrex_timed '$remote_addr $host [$time_local] "$request" $status $body_bytes_sent '
                          'rt=$request_time urt=$upstream_response_time us=$upstream_status '
                          '"$http_referer" "$http_user_agent" ray=$http_cf_ray cc=$http_cf_ipcountry';

# ---------- UAT API (HTTP -> HTTPS redirect) ----------
server {
    listen 80;
    server_name uat-api.beachrex.com;
    return 301 https://$host$request_uri;
}

# ---------- UAT API (HTTPS) ----------
server {
    listen 443 ssl;
    http2 on;
    access_log /var/log/nginx/access.log beachrex_timed;
    server_name uat-api.beachrex.com;
    client_max_body_size 25M;
    ssl_certificate /etc/letsencrypt/live/uat-api.beachrex.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/uat-api.beachrex.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    location / {
        proxy_pass http://beachrex_api_uat;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Rate limit, real client IP, gzip for JSON, keepalive to PHP (scalability audit 2026-10-09)
        limit_req zone=beachrex_api burst=100 nodelay;
        limit_req zone=beachrex_api_net burst=300 nodelay;
        limit_req_status 429;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        gzip on;
        gzip_proxied any;
        gzip_min_length 1024;
        gzip_types application/json application/javascript text/plain text/css;
    }
}

# ---------- UAT Frontend (HTTP -> HTTPS redirect) ----------
server {
    listen 80;
    server_name uat.beachrex.com;
    return 301 https://$host$request_uri;
}

# ---------- UAT Frontend (HTTPS) ----------
server {
    listen 443 ssl;
    http2 on;
    access_log /var/log/nginx/access.log beachrex_timed;
    server_name uat.beachrex.com;
    ssl_certificate /etc/letsencrypt/live/uat-api.beachrex.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/uat-api.beachrex.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    # Static build files and optimized images: never rate limited (cached by Cloudflare and browsers).
    location ~ ^/(_next/static|_next/image|images|brand|fonts)/ {
        set $beachrex_front_pool beachrex_front_uat;
        include /opt/beachrex/nginx-state/front_uat*.conf;
        proxy_pass http://$beachrex_front_pool;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 3s;
        proxy_next_upstream error timeout;
        proxy_next_upstream_tries 2;
    }

    location / {
        # Pages: per visitor IP and per /24 (see the zones above); our servers are exempt.
        limit_req zone=beachrex_pages burst=80 nodelay;
        limit_req zone=beachrex_pages_net burst=250 nodelay;
        limit_req_status 429;
        # Blue/green: blue unless the deploy's state file switches to green (see the upstreams above).
        set $beachrex_front_pool beachrex_front_uat;
        include /opt/beachrex/nginx-state/front_uat*.conf;
        proxy_pass http://$beachrex_front_pool;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $beachrex_front_connection;
        # A refused/failed connection is retried on the other color (nginx never resends a POST it already sent).
        proxy_connect_timeout 3s;
        proxy_next_upstream error timeout;
        proxy_next_upstream_tries 2;
    }
}

