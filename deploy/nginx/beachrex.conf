# BeachRex VPS — Host-level Nginx reverse proxy configuration.
# Place in /etc/nginx/sites-available/beachrex and symlink to sites-enabled.
# Certbot will add the SSL server blocks automatically (HTTP-01 challenge).
#
# After `certbot --nginx -d ...` the listen 80 blocks gain a 301 -> https.
# The upstream blocks below point to the container ports published on 127.0.0.1.

# ---------- Upstreams ----------
upstream beachrex_api_prod  { server 127.0.0.1:8081; }
upstream beachrex_api_uat   { server 127.0.0.1:8082; }
upstream beachrex_api_dev   { server 127.0.0.1:8083; }
upstream beachrex_front_prod  { server 127.0.0.1:3001; }
upstream beachrex_front_uat   { server 127.0.0.1:3002; }
upstream beachrex_front_dev   { server 127.0.0.1:3003; }

# ---------- PROD API ----------
server {
    listen 80;
    server_name api.beachrex.com;
    client_max_body_size 25M;
    location / {
        proxy_pass http://beachrex_api_prod;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ---------- UAT API ----------
server {
    listen 80;
    server_name uat-api.beachrex.com;
    client_max_body_size 25M;
    location / {
        proxy_pass http://beachrex_api_uat;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ---------- DEV API ----------
server {
    listen 80;
    server_name dev-api.beachrex.com;
    client_max_body_size 25M;
    location / {
        proxy_pass http://beachrex_api_dev;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ---------- PROD Frontend ----------
server {
    listen 80;
    server_name beachrex.com www.beachrex.com;
    location / {
        proxy_pass http://beachrex_front_prod;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# ---------- UAT Frontend ----------
server {
    listen 80;
    server_name uat.beachrex.com;
    location / {
        proxy_pass http://beachrex_front_uat;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# ---------- DEV Frontend ----------
server {
    listen 80;
    server_name dev.beachrex.com;
    location / {
        proxy_pass http://beachrex_front_dev;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
