    listen 80;
    server_name uat.beachrex.com;
    return 301 https://$host$request_uri;
}

# ---------- UAT Frontend (HTTPS) ----------
server {
    listen 443 ssl http2;
    server_name uat.beachrex.com;
    ssl_certificate /etc/letsencrypt/live/uat-api.beachrex.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/uat-api.beachrex.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    location / {
        proxy_pass http://beachrex_front_uat;
