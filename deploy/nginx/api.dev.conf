# Nginx config used INSIDE the api_dev container (web_dev service).
# Serves Laravel's static public assets and proxies PHP to api_dev:9000.
# Mounted read-only at /etc/nginx/conf.d/default.conf (included inside the http {} block).
# deploy/nginx/api.uat.conf and api.dev.conf are the same file with the environment name replaced
# (ApiNginxConfigTest checks that they stay in sync).

# ---------- Language (ADR 2026-10-30 "API performance: layered caching") ----------
# The API answers in the language of the FIRST Accept-Language tag (SetLocaleFromHeader). Browsers send long,
# varied strings ("de-DE,de;q=0.9,en;q=0.8"), so nginx reduces the header to one supported code and passes only
# that to PHP. The micro-cache key below uses the same value, so a cached answer is always in the language PHP
# would have used. Empty = not supported → PHP uses the default (en). Keep in sync with
# SetLocaleFromHeader::SUPPORTED_LOCALES (+ the aliases si → sl, cz → cs); ApiNginxConfigTest checks it.
map $http_accept_language $beachrex_locale {
    default "";
    "~*^\s*en(?:[-;,\s]|$)" en;
    "~*^\s*(?:sl|si)(?:[-;,\s]|$)" sl;
    "~*^\s*de(?:[-;,\s]|$)" de;
    "~*^\s*hr(?:[-;,\s]|$)" hr;
    "~*^\s*fr(?:[-;,\s]|$)" fr;
    "~*^\s*es(?:[-;,\s]|$)" es;
    "~*^\s*it(?:[-;,\s]|$)" it;
    "~*^\s*ua(?:[-;,\s]|$)" ua;
    "~*^\s*ru(?:[-;,\s]|$)" ru;
    "~*^\s*pl(?:[-;,\s]|$)" pl;
    "~*^\s*(?:cs|cz)(?:[-;,\s]|$)" cs;
    "~*^\s*hu(?:[-;,\s]|$)" hu;
    "~*^\s*bg(?:[-;,\s]|$)" bg;
    "~*^\s*sk(?:[-;,\s]|$)" sk;
    "~*^\s*da(?:[-;,\s]|$)" da;
    "~*^\s*pt(?:[-;,\s]|$)" pt;
    "~*^\s*nl(?:[-;,\s]|$)" nl;
    "~*^\s*el(?:[-;,\s]|$)" el;
    "~*^\s*sq(?:[-;,\s]|$)" sq;
}

# Docker DNS for the per-request upstream names below (api_<env> changes address on every deploy). http level, so
# every server block has it (the internal :8080 server had none → "no resolver defined" → 502, dev 2026-10-30).
resolver 127.0.0.11 valid=10s ipv6=off;

# ---------- Micro-cache for public GET answers ----------
# Stores only answers that PHP marks with X-Accel-Expires (middleware `public.cache:<s>`, PublicCacheHeaders):
# anonymous, 200, same for every visitor of a language. Never: requests with Authorization, errors, POST.
# One request per key and language goes to PHP at a time (cache_lock); while it refreshes, the others get the
# previous answer (use_stale updating), also when PHP fails (error/timeout/500/503). A burst of identical
# requests therefore costs PHP one request, not thousands. Bounded: 256 MB on disk inside this container, LRU.
fastcgi_cache_path /var/cache/nginx/beachrex_api levels=1:2 keys_zone=beachrex_api_micro:10m max_size=256m inactive=30m use_temp_path=off;
map $upstream_http_x_accel_expires $beachrex_api_nocache {
    ""      1;
    default 0;
}

# Access log with timings (incident 2026-10-30: the old log had no durations). The visitor's IP is in
# X-Forwarded-For (set by host nginx from CF-Connecting-IP); $remote_addr here is the Docker gateway.
log_format beachrex_api '$http_x_forwarded_for - [$time_local] "$request" $status $body_bytes_sent '
                        'rt=$request_time urt=$upstream_response_time cache=$upstream_cache_status '
                        'lang=$beachrex_locale "$http_user_agent"';

server {
    listen 80 default_server;
    server_name _;
    root /var/www/html/public;
    index index.php index.html;

    client_max_body_size 25M;
    access_log /var/log/nginx/access.log beachrex_api;

    location /storage/ {
        root /var/www/html;
        try_files $uri $uri/ =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Health has its own small PHP-FPM pool (port 9001, Dockerfile.prod) so a full main pool cannot delay it.
    # Not micro-cached. A container without that pool (older image during a rollout) refuses → main pool.
    location = /api/v1/health {
        set $php_health_upstream api_dev:9001;
        fastcgi_pass $php_health_upstream;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param HTTP_ACCEPT_LANGUAGE $beachrex_locale;
        fastcgi_connect_timeout 1s;
        fastcgi_read_timeout 15s;
        fastcgi_next_upstream error timeout;
        fastcgi_next_upstream_tries 2;
        error_page 502 504 = @health_main_pool;
    }
    location @health_main_pool {
        set $php_upstream api_dev:9000;
        fastcgi_pass $php_upstream;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param HTTP_ACCEPT_LANGUAGE $beachrex_locale;
        fastcgi_connect_timeout 1s;
        fastcgi_read_timeout 60s;
        fastcgi_next_upstream error timeout;
        fastcgi_next_upstream_tries 2;
    }

    location ~ \.php$ {
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        # Resolve api_dev on each request (Docker DNS), not once at start: when api_dev is recreated it gets
        # a new IP, and a static upstream kept the old one → 502 until web_dev restarted (prod, 2026-10-26).
        set $php_upstream api_dev:9000;
        fastcgi_pass $php_upstream;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        # Normalized language (see the map above); replaces the visitor's header for PHP.
        fastcgi_param HTTP_ACCEPT_LANGUAGE $beachrex_locale;
        fastcgi_read_timeout 60s;
        # Zero-downtime API deploy (ADR 2026-10-29, deploy/scripts/api-rollout.sh): for a few seconds the service
        # name resolves to the old and the new container. A refused or unreachable address is retried on the
        # other one; the short connect timeout stops a removed container's address from hanging a request
        # (an unanswered connect would otherwise wait ~3 s for ARP).
        fastcgi_connect_timeout 1s;
        fastcgi_next_upstream error timeout;
        fastcgi_next_upstream_tries 2;

        # Micro-cache (see fastcgi_cache_path above).
        fastcgi_cache beachrex_api_micro;
        fastcgi_cache_key "$request_method|$host|$request_uri|$beachrex_locale";
        fastcgi_cache_methods GET HEAD;
        fastcgi_cache_bypass $http_authorization;
        fastcgi_no_cache $http_authorization $beachrex_api_nocache;
        # The key already holds the language; the raw Accept-Language variants must not split the cache.
        fastcgi_ignore_headers Vary;
        fastcgi_cache_lock on;
        fastcgi_cache_lock_age 10s;
        fastcgi_cache_lock_timeout 10s;
        fastcgi_cache_use_stale updating error timeout http_500 http_503;
        fastcgi_cache_background_update on;
        add_header X-Micro-Cache $upstream_cache_status always;
    }

    location ~ /\.(?!well-known).* { deny all; }
}

# ---------- Internal status (not published on the host; reachable only inside the Docker network) ----------
# PHP-FPM pool status for the ops report (`php artisan ops:perf-report`, from the api container:
# http://web_dev:8080/fpm-status?json). Host nginx never proxies to this port.
server {
    listen 8080;
    server_name _;
    access_log off;

    location = /fpm-status {
        set $php_upstream api_dev:9000;
        fastcgi_pass $php_upstream;
        include fastcgi_params;
        fastcgi_param SCRIPT_NAME /fpm-status;
        fastcgi_param SCRIPT_FILENAME /fpm-status;
    }
    location = /fpm-status-health {
        set $php_health_upstream api_dev:9001;
        fastcgi_pass $php_health_upstream;
        include fastcgi_params;
        fastcgi_param SCRIPT_NAME /fpm-status;
        fastcgi_param SCRIPT_FILENAME /fpm-status;
    }
    location = /nginx-status {
        stub_status;
    }
    location / { return 404; }
}
