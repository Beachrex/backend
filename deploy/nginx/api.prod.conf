# Nginx config used INSIDE the api_prod container (web_prod service).
# Serves Laravel's static public assets and proxies PHP to api_prod:9000.
# Mounted read-only at /etc/nginx/conf.d/default.conf.

server {
    listen 80 default_server;
    server_name _;
    root /var/www/html/public;
    index index.php index.html;

    client_max_body_size 25M;

    resolver 127.0.0.11 valid=10s ipv6=off;

    location /storage/ {
        root /var/www/html;
        try_files $uri $uri/ =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        # Resolve api_prod on each request (Docker DNS), not once at start: when api_prod is recreated it gets
        # a new IP, and a static upstream kept the old one → 502 until web_prod restarted (prod, 2026-10-26).
        set $php_upstream api_prod:9000;
        fastcgi_pass $php_upstream;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_read_timeout 60s;
        # Zero-downtime API deploy (ADR 2026-10-29, deploy/scripts/api-rollout.sh): for a few seconds the service
        # name resolves to the old and the new container. A refused or unreachable address is retried on the
        # other one; the short connect timeout stops a removed container's address from hanging a request
        # (an unanswered connect would otherwise wait ~3 s for ARP).
        fastcgi_connect_timeout 1s;
        fastcgi_next_upstream error timeout;
        fastcgi_next_upstream_tries 2;
    }

    location ~ /\.(?!well-known).* { deny all; }
}
