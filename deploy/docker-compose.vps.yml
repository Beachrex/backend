# BeachRex VPS — Docker Compose for Hetzner CX33 (4 vCPU / 8 GB RAM)
# Hosts 3 environments (prod / uat / dev) on a single server.
#
# This file is NOT used for local development — local dev keeps using
# BR-api2/docker-compose.yml (Laravel Sail) + docker-compose.override.yml.
#
# Layout on the server (EACH environment has its own code):
#   /opt/beachrex/
#   ├── deploy/docker-compose.vps.yml   (this file)
#   ├── envs/.env.{prod,uat,dev}        (API envs, NEVER in git)
#   ├── envs/.env.front.{prod,uat,dev}
#   ├── api_prod/   (BR-api2 clone - prod branch)
#   ├── api_uat/    (BR-api2 clone - uat branch)
#   ├── api_dev/    (BR-api2 clone - dev branch)
#   ├── front_prod/ (Front/beachrex clone - prod/main branch)
#   ├── front_uat/  (Front/beachrex clone - uat branch)
#   └── front_dev/  (Front/beachrex clone - dev branch)
#
# Usage:
#   docker compose -f deploy/docker-compose.vps.yml --env-file envs/.env.prod up -d
#
# Internal ports (NOT exposed publicly; host Nginx proxies 80/443):
#   prod:  nginx 8081 | front 3001 (green 3011) | redis DB 0 | pgsql beachrex_prod
#   uat:   nginx 8082 | front 3002 (green 3012) | redis DB 1 | pgsql beachrex_uat
#   dev:   nginx 8083 | front 3003 (green 3013) | redis DB 2 | pgsql beachrex_dev
#
# Zero-downtime deploys (ADR 2026-10-29, runbook docs/runbooks/zero-downtime-deploys.md):
#   - website: blue/green. front_<env> (blue) is the normal container; front_<env>_green runs only while a
#     deploy switches traffic (deploy/scripts/front-deploy.sh). Host nginx picks the color.
#   - API: deploy/scripts/api-rollout.sh starts a second api_<env> container next to the old one, then retires
#     the old one; web_<env> (nginx) keeps running and retries the other container.

# Docker log rotation for app containers (json-file grows without limit by default).
# Not applied to the shared pgsql/redis services: changing their config would
# recreate them, restarting the database for ALL environments during a dev deploy.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

# Liveness of a Next.js website container (web-client src/app/api/health: no API call, no page render).
# Next.js standalone listens on the container's hostname, not on 127.0.0.1.
x-front-healthcheck: &front-healthcheck
  test: ["CMD-SHELL", "wget -q -O /dev/null http://$${HOSTNAME}:$${PORT}/api/health || exit 1"]
  interval: 10s
  timeout: 3s
  retries: 3
  start_period: 30s

services:
  # ===================== SHARED DATA SERVICES =====================
  pgsql:
    image: postgis/postgis:15-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: beachrex_prod
    volumes:
      - pgsql-data:/var/lib/postgresql/data
      - ../api_prod/database/postgis/init-postgis-multi.sql:/docker-entrypoint-initdb.d/20-init-postgis.sql:ro
    networks: [net_prod, net_uat, net_dev]
    healthcheck:
      test: ["CMD", "pg_isready", "-q", "-U", "${DB_USERNAME}"]
      retries: 5
      timeout: 5s
      interval: 10s
    # No published ports — only reachable from inside Docker networks

  redis:
    image: redis:alpine
    restart: unless-stopped
    # Used as the cache (.env.example: sessions and queues in the database): 1 GB cap, evict least-recently-used keys,
    # snapshot less often (a fork every minute was costly). Scalability audit 2026-10-09.
    command: redis-server --databases 16 --save 900 1 --save 300 100 --maxmemory 1gb --maxmemory-policy allkeys-lru --loglevel warning
    volumes: [redis-data:/data]
    networks: [net_prod, net_uat, net_dev]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      retries: 3
      timeout: 5s
      interval: 10s

  # ===================== PRODUCTION =====================
  api_prod:
    logging: *default-logging
    build:
      context: ../api_prod
      dockerfile: Dockerfile.prod
    image: beachrex/api:prod
    restart: unless-stopped
    env_file: [../envs/.env.prod]
    environment:
      DB_DATABASE: beachrex_prod
      REDIS_DB: "0"
      APP_ENV: production
    volumes:
      - api-storage-prod:/var/www/html/storage
    networks: [net_prod]
    depends_on:
      pgsql: { condition: service_healthy }
      redis: { condition: service_healthy }

  web_prod:
    logging: *default-logging
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./nginx/api.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ../api_prod/public:/var/www/html/public:ro
      - api-storage-prod:/var/www/html/storage:ro
    networks: [net_prod]
    depends_on: [api_prod]
    # Port exposed to host Nginx reverse-proxy
    ports: ["127.0.0.1:8081:80"]

  scheduler_prod:
    # Runs `php artisan schedule:work` (daily db:backup, see config/backup.php).
    # Reuses the image built for api_prod; never built or pulled on its own.
    image: beachrex/api:prod
    pull_policy: never
    command: ["php", "artisan", "schedule:work"]
    restart: unless-stopped
    logging: *default-logging
    env_file: [../envs/.env.prod]
    environment:
      DB_DATABASE: beachrex_prod
      REDIS_DB: "0"
      APP_ENV: production
    volumes:
      - api-storage-prod:/var/www/html/storage
    networks: [net_prod]
    depends_on:
      api_prod: { condition: service_started }

  worker_prod:
    # AI-3: runs paid itineraries in the background (20-120 s each; PHP-FPM stops requests at 60 s).
    # One job at a time; --timeout must stay below retry_after (300 s) of the `itineraries` queue connection.
    # Reuses the image built for api_prod; never built or pulled on its own.
    image: beachrex/api:prod
    pull_policy: never
    command: ["php", "artisan", "queue:work", "itineraries", "--queue=itineraries", "--tries=1", "--timeout=240", "--sleep=2", "--max-time=3600"]
    restart: unless-stopped
    logging: *default-logging
    env_file: [../envs/.env.prod]
    environment:
      DB_DATABASE: beachrex_prod
      REDIS_DB: "0"
      APP_ENV: production
    volumes:
      - api-storage-prod:/var/www/html/storage
    networks: [net_prod]
    depends_on:
      api_prod: { condition: service_started }

  front_prod:
    logging: *default-logging
    build:
      context: ../front_prod
      dockerfile: Dockerfile.prod
      args:
        NEXT_PUBLIC_API_ENDPOINT: ${NEXT_PUBLIC_API_ENDPOINT}
        NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL}
        NEXT_PUBLIC_CDN_TEASER: ${NEXT_PUBLIC_CDN_TEASER}
        NEXT_PUBLIC_CDN_LARGE: ${NEXT_PUBLIC_CDN_LARGE}
        NEXT_PUBLIC_CDN_ASSETS: ${NEXT_PUBLIC_CDN_ASSETS}
        # Cloudflare Turnstile on the AI chat; empty = off (set in .env.front.<env>)
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
    image: beachrex/front:prod
    restart: unless-stopped
    env_file: [../envs/.env.front.prod]
    environment:
      NODE_ENV: production
      PORT: "3001"
      BEACHREX_COLOR: blue
      # Bounded in-memory page/fetch cache (web-client cache-handler.cjs, ADR 2026-10-30 "Bounded Next.js cache")
      NEXT_CACHE_MAX_MB: "256"
    # Safety net: the Next.js cache folder is a size-limited tmpfs, never the disk (empty while the bounded
    # handler works; full = cache writes fail, pages still render). uid/gid = the image's nextjs user.
    tmpfs: ["/app/.next/cache:size=256m,uid=1001,gid=1001,mode=0755"]
    networks: [net_prod]
    ports: ["127.0.0.1:3001:3001"]
    healthcheck: *front-healthcheck

  front_prod_green:
    # Blue/green partner of front_prod (ADR 2026-10-29): same image, own port, runs only during a website
    # deploy (deploy/scripts/front-deploy.sh). The profile keeps a plain `docker compose up -d` from starting it.
    profiles: [green]
    logging: *default-logging
    image: beachrex/front:prod
    pull_policy: never
    restart: unless-stopped
    env_file: [../envs/.env.front.prod]
    environment:
      NODE_ENV: production
      PORT: "3011"
      BEACHREX_COLOR: green
      # Bounded in-memory page/fetch cache (web-client cache-handler.cjs, ADR 2026-10-30 "Bounded Next.js cache")
      NEXT_CACHE_MAX_MB: "256"
    # Safety net: the Next.js cache folder is a size-limited tmpfs, never the disk (empty while the bounded
    # handler works; full = cache writes fail, pages still render). uid/gid = the image's nextjs user.
    tmpfs: ["/app/.next/cache:size=256m,uid=1001,gid=1001,mode=0755"]
    networks: [net_prod]
    ports: ["127.0.0.1:3011:3011"]
    healthcheck: *front-healthcheck

  # ===================== UAT =====================
  api_uat:
    logging: *default-logging
    build:
      context: ../api_uat
      dockerfile: Dockerfile.prod
    image: beachrex/api:uat
    restart: unless-stopped
    env_file: [../envs/.env.uat]
    environment:
      DB_DATABASE: beachrex_uat
      REDIS_DB: "1"
      APP_ENV: production
    volumes:
      - api-storage-uat:/var/www/html/storage
    networks: [net_uat]
    depends_on:
      pgsql: { condition: service_healthy }
      redis: { condition: service_healthy }

  web_uat:
    logging: *default-logging
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./nginx/api.uat.conf:/etc/nginx/conf.d/default.conf:ro
      - ../api_uat/public:/var/www/html/public:ro
      - api-storage-uat:/var/www/html/storage:ro
    networks: [net_uat]
    depends_on: [api_uat]
    ports: ["127.0.0.1:8082:80"]

  scheduler_uat:
    # Runs `php artisan schedule:work` (daily db:backup, see config/backup.php).
    # Reuses the image built for api_uat; never built or pulled on its own.
    image: beachrex/api:uat
    pull_policy: never
    command: ["php", "artisan", "schedule:work"]
    restart: unless-stopped
    logging: *default-logging
    env_file: [../envs/.env.uat]
    environment:
      DB_DATABASE: beachrex_uat
      REDIS_DB: "1"
      APP_ENV: production
    volumes:
      - api-storage-uat:/var/www/html/storage
    networks: [net_uat]
    depends_on:
      api_uat: { condition: service_started }

  worker_uat:
    # AI-3: runs paid itineraries in the background (20-120 s each; PHP-FPM stops requests at 60 s).
    # One job at a time; --timeout must stay below retry_after (300 s) of the `itineraries` queue connection.
    # Reuses the image built for api_uat; never built or pulled on its own.
    image: beachrex/api:uat
    pull_policy: never
    command: ["php", "artisan", "queue:work", "itineraries", "--queue=itineraries", "--tries=1", "--timeout=240", "--sleep=2", "--max-time=3600"]
    restart: unless-stopped
    logging: *default-logging
    env_file: [../envs/.env.uat]
    environment:
      DB_DATABASE: beachrex_uat
      REDIS_DB: "1"
      APP_ENV: production
    volumes:
      - api-storage-uat:/var/www/html/storage
    networks: [net_uat]
    depends_on:
      api_uat: { condition: service_started }

  front_uat:
    logging: *default-logging
    build:
      context: ../front_uat
      dockerfile: Dockerfile.prod
      args:
        NEXT_PUBLIC_API_ENDPOINT: ${NEXT_PUBLIC_API_ENDPOINT}
        NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL}
        NEXT_PUBLIC_CDN_TEASER: ${NEXT_PUBLIC_CDN_TEASER}
        NEXT_PUBLIC_CDN_LARGE: ${NEXT_PUBLIC_CDN_LARGE}
        NEXT_PUBLIC_CDN_ASSETS: ${NEXT_PUBLIC_CDN_ASSETS}
        # Cloudflare Turnstile on the AI chat; empty = off (set in .env.front.<env>)
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
    image: beachrex/front:uat
    restart: unless-stopped
    env_file: [../envs/.env.front.uat]
    environment:
      NODE_ENV: production
      PORT: "3002"
      BEACHREX_COLOR: blue
      # Bounded in-memory page/fetch cache (web-client cache-handler.cjs, ADR 2026-10-30 "Bounded Next.js cache")
      NEXT_CACHE_MAX_MB: "64"
    # Safety net: the Next.js cache folder is a size-limited tmpfs, never the disk (empty while the bounded
    # handler works; full = cache writes fail, pages still render). uid/gid = the image's nextjs user.
    tmpfs: ["/app/.next/cache:size=256m,uid=1001,gid=1001,mode=0755"]
    networks: [net_uat]
    ports: ["127.0.0.1:3002:3002"]
    healthcheck: *front-healthcheck

  front_uat_green:
    # Blue/green partner of front_uat (ADR 2026-10-29): same image, own port, runs only during a website
    # deploy (deploy/scripts/front-deploy.sh). The profile keeps a plain `docker compose up -d` from starting it.
    profiles: [green]
    logging: *default-logging
    image: beachrex/front:uat
    pull_policy: never
    restart: unless-stopped
    env_file: [../envs/.env.front.uat]
    environment:
      NODE_ENV: production
      PORT: "3012"
      BEACHREX_COLOR: green
      # Bounded in-memory page/fetch cache (web-client cache-handler.cjs, ADR 2026-10-30 "Bounded Next.js cache")
      NEXT_CACHE_MAX_MB: "64"
    # Safety net: the Next.js cache folder is a size-limited tmpfs, never the disk (empty while the bounded
    # handler works; full = cache writes fail, pages still render). uid/gid = the image's nextjs user.
    tmpfs: ["/app/.next/cache:size=256m,uid=1001,gid=1001,mode=0755"]
    networks: [net_uat]
    ports: ["127.0.0.1:3012:3012"]
    healthcheck: *front-healthcheck

  # ===================== DEV =====================
  api_dev:
    logging: *default-logging
    build:
      context: ../api_dev
      dockerfile: Dockerfile.prod
    image: beachrex/api:dev
    restart: unless-stopped
    env_file: [../envs/.env.dev]
    environment:
      DB_DATABASE: beachrex_dev
      REDIS_DB: "2"
      APP_ENV: local
    volumes:
      - api-storage-dev:/var/www/html/storage
    networks: [net_dev]
    depends_on:
      pgsql: { condition: service_healthy }
      redis: { condition: service_healthy }

  web_dev:
    logging: *default-logging
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./nginx/api.dev.conf:/etc/nginx/conf.d/default.conf:ro
      - ../api_dev/public:/var/www/html/public:ro
      - api-storage-dev:/var/www/html/storage:ro
    networks: [net_dev]
    depends_on: [api_dev]
    ports: ["127.0.0.1:8083:80"]

  scheduler_dev:
    # Runs `php artisan schedule:work` (daily db:backup, see config/backup.php).
    # Reuses the image built for api_dev; never built or pulled on its own.
    image: beachrex/api:dev
    pull_policy: never
    command: ["php", "artisan", "schedule:work"]
    restart: unless-stopped
    logging: *default-logging
    env_file: [../envs/.env.dev]
    environment:
      DB_DATABASE: beachrex_dev
      REDIS_DB: "2"
      APP_ENV: local
    volumes:
      - api-storage-dev:/var/www/html/storage
    networks: [net_dev]
    depends_on:
      api_dev: { condition: service_started }

  worker_dev:
    # AI-3: runs paid itineraries in the background (20-120 s each; PHP-FPM stops requests at 60 s).
    # One job at a time; --timeout must stay below retry_after (300 s) of the `itineraries` queue connection.
    # Reuses the image built for api_dev; never built or pulled on its own.
    image: beachrex/api:dev
    pull_policy: never
    command: ["php", "artisan", "queue:work", "itineraries", "--queue=itineraries", "--tries=1", "--timeout=240", "--sleep=2", "--max-time=3600"]
    restart: unless-stopped
    logging: *default-logging
    env_file: [../envs/.env.dev]
    environment:
      DB_DATABASE: beachrex_dev
      REDIS_DB: "2"
      APP_ENV: local
    volumes:
      - api-storage-dev:/var/www/html/storage
    networks: [net_dev]
    depends_on:
      api_dev: { condition: service_started }

  front_dev:
    logging: *default-logging
    build:
      context: ../front_dev
      dockerfile: Dockerfile.prod
      args:
        NEXT_PUBLIC_API_ENDPOINT: ${NEXT_PUBLIC_API_ENDPOINT}
        NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL}
        NEXT_PUBLIC_CDN_TEASER: ${NEXT_PUBLIC_CDN_TEASER}
        NEXT_PUBLIC_CDN_LARGE: ${NEXT_PUBLIC_CDN_LARGE}
        NEXT_PUBLIC_CDN_ASSETS: ${NEXT_PUBLIC_CDN_ASSETS}
        # Cloudflare Turnstile on the AI chat; empty = off (set in .env.front.<env>)
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
    image: beachrex/front:dev
    restart: unless-stopped
    env_file: [../envs/.env.front.dev]
    environment:
      NODE_ENV: development
      PORT: "3003"
      BEACHREX_COLOR: blue
      # Bounded in-memory page/fetch cache (web-client cache-handler.cjs, ADR 2026-10-30 "Bounded Next.js cache")
      NEXT_CACHE_MAX_MB: "64"
    # Safety net: the Next.js cache folder is a size-limited tmpfs, never the disk (empty while the bounded
    # handler works; full = cache writes fail, pages still render). uid/gid = the image's nextjs user.
    tmpfs: ["/app/.next/cache:size=256m,uid=1001,gid=1001,mode=0755"]
    networks: [net_dev]
    ports: ["127.0.0.1:3003:3003"]
    healthcheck: *front-healthcheck

  front_dev_green:
    # Blue/green partner of front_dev (ADR 2026-10-29): same image, own port, runs only during a website
    # deploy (deploy/scripts/front-deploy.sh). The profile keeps a plain `docker compose up -d` from starting it.
    profiles: [green]
    logging: *default-logging
    image: beachrex/front:dev
    pull_policy: never
    restart: unless-stopped
    env_file: [../envs/.env.front.dev]
    environment:
      NODE_ENV: development
      PORT: "3013"
      BEACHREX_COLOR: green
      # Bounded in-memory page/fetch cache (web-client cache-handler.cjs, ADR 2026-10-30 "Bounded Next.js cache")
      NEXT_CACHE_MAX_MB: "64"
    # Safety net: the Next.js cache folder is a size-limited tmpfs, never the disk (empty while the bounded
    # handler works; full = cache writes fail, pages still render). uid/gid = the image's nextjs user.
    tmpfs: ["/app/.next/cache:size=256m,uid=1001,gid=1001,mode=0755"]
    networks: [net_dev]
    ports: ["127.0.0.1:3013:3013"]
    healthcheck: *front-healthcheck

networks:
  net_prod:  { driver: bridge }
  net_uat:   { driver: bridge }
  net_dev:   { driver: bridge }

volumes:
  pgsql-data:       { driver: local }
  redis-data:       { driver: local }
  api-storage-prod: { driver: local }
  api-storage-uat:  { driver: local }
  api-storage-dev:  { driver: local }
