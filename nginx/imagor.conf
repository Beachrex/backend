# Imagor Image Processing Proxy Configuration
# This proxies requests from imagor.beachrex.com to the internal Imagor service

server {
    listen 80;
    listen [::]:80;
    server_name imagor.beachrex.com;

    # Redirect HTTP to HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name imagor.beachrex.com;

    # SSL certificates (managed by Laravel Cloud / Cloudflare)
    # ssl_certificate /path/to/cert.pem;
    # ssl_certificate_key /path/to/key.pem;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # CORS headers (allow all origins for images)
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
    add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range" always;

    # Logging
    access_log /var/log/nginx/imagor-access.log;
    error_log /var/log/nginx/imagor-error.log;

    # Proxy all requests to Imagor service
    location / {
        proxy_pass http://imagor:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Increase timeouts for large images
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Buffer settings
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;

        # Cache headers from Imagor
        proxy_pass_header Cache-Control;
        proxy_pass_header Expires;
    }

    # Health check endpoint
    location /health {
        proxy_pass http://imagor:8000/;
        access_log off;
    }
}

