# Laravel + Imagor Nginx Configuration
# This configuration serves Laravel app and proxies /imagor/ to Imagor service

server {
    listen 80;
    listen [::]:80;
    server_name dev-api.beachrex.com;
    root /var/www/html/public;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    index index.php;

    charset utf-8;

    # Imagor proxy - handles all image transformation requests
    location /imagor/ {
        # Remove /imagor prefix when proxying to Imagor service
        rewrite ^/imagor/(.*)$ /$1 break;
        
        proxy_pass http://imagor:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # CORS headers for images
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;

        # Increase timeouts for large images
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Cache headers from Imagor
        proxy_pass_header Cache-Control;
        proxy_pass_header Expires;
    }

    # Laravel application routes
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}

