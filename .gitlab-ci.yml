# BeachRex API — GitLab CI/CD
# Auto-deploys the Laravel backend to the Hetzner VPS on push to dev/uat/main.
# The VPS runs docker-compose.vps.yml (in /opt/beachrex/deploy/) which references
# ../api/ and ../front/ directories.
#
# Required GitLab CI/CD Variables (Settings → CI/CD → Variables):
#   VPS_HOST             — e.g. 2.28.76.142
#   VPS_USER             — beachrex
#   VPS_SSH_PRIVATE_KEY  — base64-encoded private SSH key for the VPS user
#
# .env files are stored ONLY on the server (/opt/beachrex/envs/.env.{dev,uat,prod})
# and are NOT synced from GitLab. Update them directly on the VPS when needed.

stages:
  - test
  - deploy

variables:
  COMPOSE_FILE: deploy/docker-compose.vps.yml

# ───────────────────────── TEST ─────────────────────────
.test-template: &test-template
  stage: test
  image: php:8.4-cli
  services:
    - name: postgis/postgis:15-3.4
      alias: pgsql
      variables:
        POSTGRES_USER: sail
        POSTGRES_PASSWORD: password
        POSTGRES_DB: beachrex_test
  variables:
    # Don't clone whole repo for test job
    GIT_DEPTH: 20
  before_script:
    - apt-get update -y && apt-get install -y --no-install-recommends libpq-dev libzip-dev unzip git libicu-dev libpng-dev libjpeg62-turbo-dev libfreetype6-dev libonig-dev postgresql-client
    - docker-php-ext-configure gd --with-freetype --with-jpeg
    - docker-php-ext-install -j"$(nproc)" pdo_pgsql zip pcntl intl gd bcmath
    - curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/bin/ --filename=composer
  script:
    - composer install --no-interaction --prefer-dist
    - cp .env.example .env
    - php artisan key:generate --ansi
    # Enable PostGIS + spatial functions in the test database
    - PGPASSWORD=password psql -h pgsql -U sail -d beachrex_test -c "CREATE EXTENSION IF NOT EXISTS postgis;"
    - PGPASSWORD=password psql -h pgsql -U sail -d beachrex_test -c "CREATE EXTENSION IF NOT EXISTS postgis_topology;"
    - PGPASSWORD=password psql -h pgsql -U sail -d beachrex_test -f database/postgis/init-postgis.sql || true
    - php artisan test --without-tty
  rules:
    - if: $CI_COMMIT_BRANCH =~ /^(dev|uat|main)$/

# ───────────────────────── DEPLOY ─────────────────────────
.deploy-template: &deploy-template
  stage: deploy
  image: alpine:3.20
  needs: [test]
  before_script:
    - apk add --no-cache openssh-client rsync
    - mkdir -p ~/.ssh
    - echo "$VPS_SSH_PRIVATE_KEY" | base64 -d > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
  script:
    # 1. Sync code to VPS (excluding .env — it stays on the server)
    - rsync -az --delete
        --exclude '.git' --exclude 'node_modules' --exclude 'vendor'
        --exclude 'storage/logs/*' --exclude 'storage/framework/cache/data/*'
        --exclude 'storage/framework/sessions/*' --exclude 'storage/framework/views/*'
        --exclude 'database/database.sqlite' --exclude '.env'
        ./ "$VPS_USER@$VPS_HOST:/opt/beachrex/api/"
    # 2. Sync deploy/ directory (compose + nginx configs)
    - rsync -az --delete deploy/ "$VPS_USER@$VPS_HOST:/opt/beachrex/deploy/"
    # 3. Build, migrate and start on VPS (uses existing .env on server)
    - ssh "$VPS_USER@$VPS_HOST" "
        set -euo pipefail
        cd /opt/beachrex/deploy
        export ENV_NAME=${ENV_NAME}
        export API_SVC=api_${ENV_NAME}
        export WEB_SVC=web_${ENV_NAME}
        docker compose --env-file /opt/beachrex/envs/.env.\${ENV_NAME} build \${API_SVC}
        docker compose --env-file /opt/beachrex/envs/.env.\${ENV_NAME} up -d pgsql redis
        docker compose --env-file /opt/beachrex/envs/.env.\${ENV_NAME} up -d --force-recreate \${WEB_SVC}
        docker compose --env-file /opt/beachrex/envs/.env.\${ENV_NAME} exec -T \${API_SVC} php artisan migrate --force
        docker compose --env-file /opt/beachrex/envs/.env.\${ENV_NAME} exec -T \${API_SVC} php artisan config:cache
        docker compose --env-file /opt/beachrex/envs/.env.\${ENV_NAME} exec -T \${API_SVC} php artisan route:cache
        docker compose --env-file /opt/beachrex/envs/.env.\${ENV_NAME} exec -T \${API_SVC} php artisan cache:clear
        docker compose --env-file /opt/beachrex/envs/.env.\${ENV_NAME} exec -T \${API_SVC} php artisan search:index || true
        echo 'Deploy of '\${ENV_NAME}' complete.'
      "
    # 4. Reload host Nginx
    - ssh "$VPS_USER@$VPS_HOST" "sudo systemctl reload nginx"

# ───────────── JOBS PER BRANCH ─────────────
test:
  <<: *test-template

deploy:dev:
  <<: *deploy-template
  variables:
    ENV_NAME: dev
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"

deploy:uat:
  <<: *deploy-template
  variables:
    ENV_NAME: uat
  rules:
    - if: $CI_COMMIT_BRANCH == "uat"

deploy:prod:
  <<: *deploy-template
  variables:
    ENV_NAME: prod
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  when: manual  # Require manual click for production
