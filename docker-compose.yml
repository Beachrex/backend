services:
    laravel.test:
        build:
            context: ./vendor/laravel/sail/runtimes/8.4
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP}'
        image: sail-8.4/app
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - '${APP_PORT:-80}:80'
            - '${VITE_PORT:-5173}:${VITE_PORT:-5173}'
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
            IGNITION_LOCAL_SITES_PATH: '${PWD}'
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
        depends_on:
            - pgsql
            - redis
    pgsql:
        image: 'postgis/postgis:15-3.4'
        ports:
            - '${FORWARD_DB_PORT:-5432}:5432'
        environment:
            PGPASSWORD: '${DB_PASSWORD:-secret}'
            POSTGRES_DB: '${DB_DATABASE}'
            POSTGRES_USER: '${DB_USERNAME}'
            POSTGRES_PASSWORD: '${DB_PASSWORD:-secret}'
        volumes:
            - 'sail-pgsql:/var/lib/postgresql/data'
            - './vendor/laravel/sail/database/pgsql/create-testing-database.sql:/docker-entrypoint-initdb.d/10-create-testing-database.sql'
            - './database/postgis/init-postgis.sql:/docker-entrypoint-initdb.d/20-init-postgis.sql'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - pg_isready
                - '-q'
                - '-d'
                - '${DB_DATABASE}'
                - '-U'
                - '${DB_USERNAME}'
            retries: 3
            timeout: 5s
    redis:
        image: 'redis:alpine'
        ports:
            - '${FORWARD_REDIS_PORT:-6379}:6379'
        volumes:
            - 'sail-redis:/data'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - redis-cli
                - ping
            retries: 3
            timeout: 5s
    imagor:
        image: 'shumc/imagor:latest'
        # Port mapping removed - access via Nginx proxy instead
        # ports:
        #     - '${IMAGOR_PORT:-8001}:8000'
        environment:
            PORT: 8000
            IMAGOR_SECRET: '${IMAGOR_SECRET}'
            IMAGOR_UNSAFE: '${IMAGOR_UNSAFE:-0}'  # Set to 1 to enable unsigned URLs for testing
            IMAGOR_AUTO_WEBP: '${IMAGOR_AUTO_WEBP:-1}'
            IMAGOR_AUTO_AVIF: '${IMAGOR_AUTO_AVIF:-0}'
            IMAGOR_CACHE_HEADER_TTL: '${IMAGOR_CACHE_HEADER_TTL:-168h}'
            IMAGOR_CACHE_HEADER_SWR: '${IMAGOR_CACHE_HEADER_SWR:-24h}'

            # S3/DigitalOcean Spaces Configuration
            AWS_ACCESS_KEY_ID: '${DO_SPACES_KEY}'
            AWS_SECRET_ACCESS_KEY: '${DO_SPACES_SECRET}'
            AWS_REGION: '${DO_SPACES_REGION}'
            S3_ENDPOINT: '${DO_SPACES_ENDPOINT}'
            S3_FORCE_PATH_STYLE: 1

            # S3 Loader - Load images from DigitalOcean Spaces
            S3_LOADER_BUCKET: '${DO_SPACES_BUCKET}'
            S3_LOADER_BASE_DIR: 'public'

            # S3 Result Storage - Cache processed images
            S3_RESULT_STORAGE_BUCKET: '${DO_SPACES_BUCKET}'
            S3_RESULT_STORAGE_BASE_DIR: 'public/imagor-cache'
            S3_RESULT_STORAGE_ACL: 'public-read'
            S3_RESULT_STORAGE_EXPIRATION: '${IMAGOR_RESULT_STORAGE_EXPIRATION:-720h}'

            # VIPS Configuration
            VIPS_MAX_WIDTH: '${IMAGOR_MAX_WIDTH:-5000}'
            VIPS_MAX_HEIGHT: '${IMAGOR_MAX_HEIGHT:-5000}'
            VIPS_MAX_RESOLUTION: '${IMAGOR_MAX_RESOLUTION:-16800000}'

            # Server Configuration
            SERVER_CORS: 1
            SERVER_ACCESS_LOG: '${IMAGOR_ACCESS_LOG:-0}'
        networks:
            - sail
        healthcheck:
            test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8000/"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 10s
networks:
    sail:
        driver: bridge
volumes:
    sail-pgsql:
        driver: local
    sail-redis:
        driver: local
